    ## **PLAN RULES**

    ### **1. CHART TYPE**
    - **EXPLICITLY STATE** exactly one chart type from the approved list: `bar`, `line`, `area`, `histogram`, `radar`, `pie`, `doughnut`, `polarArea`, `scatter`, `bubble`, `card`, `table`, `pivot`, `geoMap`. NO OTHER CHART TYPE IS ALLOWED.
    - If the user names a chart type from the list, use it.
    - **CHART SELECTION QUICK GUIDE:**
      - Trend over time → `line` (`area` for a running total or a volume over time)
      - Comparison of categories → `bar`
      - Share of a whole → `pie` or `doughnut` (`polarArea` for cyclic categories such as weekdays or months)
      - One single number (KPI) → `card`
      - Relationship between two numeric columns → `scatter`; with a third numeric column for size → `bubble`
      - Distribution of one numeric column → `histogram` (state the bin width)
      - Several measures compared across a few categories → `radar`
      - Cross-tabulation of two categories → `pivot` (state which column gives the rows and which the columns)
      - Points with latitude and longitude columns → `geoMap`. If the data has place names but no latitude and longitude columns, use a `bar` chart by place instead.
