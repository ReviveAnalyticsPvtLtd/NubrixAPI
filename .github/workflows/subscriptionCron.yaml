name: Subscription Expiry Manager

on:
  # Manual diagnostic only. Celery Beat owns the recurring expiry schedule.
  workflow_dispatch:

jobs:
  run-subscription-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests python-dateutil loguru logtail-python razorpay

      - name: Run subscription manager
        env:
          PYTHONPATH: "."
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FREE_TRIAL_EXPIRY_WARNING_EMAIL_URL: ${{ secrets.FREE_TRIAL_EXPIRY_WARNING_EMAIL_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GRACE_PERIOD_DAYS: "3"
        run: |
          python nubrix/components/subscriptionManager.py
