name: Backend CI

on:
  pull_request:
    branches: [main, feature/subscription-model-expand, feature/subscription-lifecycle-unify]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Unit and regression tests
        env:
          COVERAGE_FILE: ${{ runner.temp }}/unit.coverage
        run: uv run --no-sync coverage run --branch --source=api,nubrix,utils -m pytest -q --junitxml="$RUNNER_TEMP/unit.xml"
      - name: Publish unit coverage baseline
        env:
          COVERAGE_FILE: ${{ runner.temp }}/unit.coverage
        run: |
          uv run --no-sync coverage xml -o "$RUNNER_TEMP/unit-coverage.xml"
          uv run --no-sync python - "$RUNNER_TEMP/unit-coverage.xml" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          from xml.etree.ElementTree import parse

          coverage = parse(sys.argv[1]).getroot()
          print("### Unit and regression coverage")
          print(f"- Lines: {float(coverage.attrib['line-rate']):.1%}")
          print(f"- Branches: {float(coverage.attrib['branch-rate']):.1%}")
          PY
      - name: Upload unit test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-unit
          path: |
            ${{ runner.temp }}/unit.xml
            ${{ runner.temp }}/unit-coverage.xml
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PostgreSQL, Redis, website-visit, and migration checks
        run: python3 scripts/run_local_checks.py integration --reports "$RUNNER_TEMP/integration-results"
      - name: Upload integration test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-integration
          path: ${{ runner.temp }}/integration-results/*.xml
          retention-days: 14

  sandbox-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux sandbox isolation tests
        run: python3 scripts/run_local_checks.py sandbox --reports "$RUNNER_TEMP/sandbox-results"
      - name: Upload sandbox test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-sandbox
          path: ${{ runner.temp }}/sandbox-results/sandbox.xml
          retention-days: 14

  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Boot the release image and check the API, worker, and Beat
        run: python3 scripts/run_local_checks.py smoke

  backend-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit, integration, sandbox-isolation, release-smoke]
    if: ${{ always() }}
    steps:
      - name: Report the overall backend result
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SANDBOX_RESULT: ${{ needs.sandbox-isolation.result }}
          RELEASE_SMOKE_RESULT: ${{ needs.release-smoke.result }}
        run: |
          printf 'unit=%s integration=%s sandbox-isolation=%s release-smoke=%s\n' \
            "$UNIT_RESULT" "$INTEGRATION_RESULT" "$SANDBOX_RESULT" "$RELEASE_SMOKE_RESULT"
          [[ "$UNIT_RESULT" == success && "$INTEGRATION_RESULT" == success &&
             "$SANDBOX_RESULT" == success && "$RELEASE_SMOKE_RESULT" == success ]]
