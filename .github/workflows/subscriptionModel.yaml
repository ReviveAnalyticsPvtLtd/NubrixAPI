name: Backend CI

on:
  pull_request:
    branches: [main, feature/subscription-model-expand, feature/subscription-lifecycle-unify]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Unit and regression tests
        run: uv run --no-sync pytest -q --junitxml="$RUNNER_TEMP/unit.xml"
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-unit
          path: ${{ runner.temp }}/unit.xml
          retention-days: 14

  sandbox-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build -t nubrix-sandbox .
      - name: Sandbox tests as root in that image, where runs get their own uids
        run: |
          mkdir -p "$RUNNER_TEMP/sandbox-results"
          docker run --rm \
            --volume "$RUNNER_TEMP/sandbox-results:/test-results" \
            nubrix-sandbox bash -euc '
              uv sync --locked --group dev
              uv run --no-sync pytest -q -rs \
                test/test_sandbox_storage_reads.py \
                test/test_sandbox_run_limits.py \
                test/test_sandbox_seccomp.py \
                test/test_stored_tables.py \
                --junitxml=/test-results/sandbox.xml
              uv run --no-sync python scripts/check_ci_junit.py /test-results/sandbox.xml \
                --allow-skip test.test_sandbox_storage_reads.test_sameUidRunsNeedAnExplicitOptIn \
                --allow-skip test.test_sandbox_storage_reads.test_parentThatCantChangeUidRefusesToRunWhenTheImageRequiresIt
            '
      - name: Upload sandbox test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-sandbox
          path: ${{ runner.temp }}/sandbox-results/sandbox.xml
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: manual_billing_test_subscription_model
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manual_billing_test_subscription_model"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RUN_MANUAL_BILLING_INTEGRATION: '1'
      RUN_LIVE_SCHEMA_INTEGRATION: '1'
      MANUAL_BILLING_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/manual_billing_test_subscription_model
      LIVE_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/manual_billing_test_live_shape
      SUBSCRIPTION_MODEL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/manual_billing_test_subscription_expand
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Create additional disposable fixture databases
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from contextlib import closing
          import psycopg2
          with closing(psycopg2.connect(os.environ['MANUAL_BILLING_TEST_DATABASE_URL'])) as connection:
              connection.autocommit = True
              with connection.cursor() as cursor:
                  cursor.execute('CREATE DATABASE manual_billing_test_live_shape')
                  cursor.execute('CREATE DATABASE manual_billing_test_subscription_expand')
                  # Roles are cluster-wide. Both fixtures need Supabase's real
                  # service-role bypass semantics, independent of module order.
                  cursor.execute('CREATE ROLE service_role NOLOGIN BYPASSRLS')
          PY
      - name: PostgreSQL financial and current-shape regressions
        run: |
          uv run --no-sync pytest -q \
            test/test_manual_billing_postgres_integration.py \
            test/test_catalog_invoice_postgres.py \
            test/test_admin_credit_reset_postgres.py \
            test/test_gap_remediation_postgres.py \
            test/test_live_billing_schema_postgres.py \
            test/test_subscription_model_postgres.py \
            test/test_subscription_model_repository.py \
            test/test_subscription_model_finalization.py \
            test/test_subscription_erasure_postgres.py \
            test/test_subscription_model_cutover_postgres.py \
            test/test_subscription_model_contract.py \
            test/test_purchase_checkout_postgres.py \
            test/test_payment_refunds_postgres.py \
            test/test_payment_replacement_postgres.py \
            test/test_capture_finalization_postgres.py \
            test/test_payment_fix_regressions_postgres.py \
            --junitxml="$RUNNER_TEMP/postgres.xml"
      - name: Require executed PostgreSQL cases
        run: uv run --no-sync python scripts/check_ci_junit.py "$RUNNER_TEMP/postgres.xml"
      - name: Upload PostgreSQL test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-postgres
          path: ${{ runner.temp }}/postgres.xml
          retention-days: 14

  backend-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit, postgres, sandbox-isolation]
    if: ${{ always() }}
    steps:
      - name: Require all backend jobs to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SANDBOX_RESULT: ${{ needs.sandbox-isolation.result }}
        run: |
          printf 'unit=%s postgres=%s sandbox-isolation=%s\n' \
            "$UNIT_RESULT" "$POSTGRES_RESULT" "$SANDBOX_RESULT"
          [[ "$UNIT_RESULT" == success && "$POSTGRES_RESULT" == success && "$SANDBOX_RESULT" == success ]]
